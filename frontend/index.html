<!doctype html>
<!-- Dark-only theme — the :root variables in globals.css are the dark palette. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omkar Jadhav — Software Development Engineer I at Nonstop IO</title>
    <meta
      name="description"
      content="Omkar Jadhav is a Software Development Engineer I at Nonstop IO Technologies, Pune. B.Tech CSE (Data Science), KIT Kolhapur. C#, NestJS, SQL, Spring Boot."
    />
    <!--
      Absolute URLs below are substituted at build time from VITE_SITE_URL
      (see frontend/vite/seo-assets.ts). Never hardcode the domain here: the
      move to a custom domain must cost one environment-variable change.
    -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="Omkar Jadhav's Portfolio" />
    <meta property="og:title" content="Omkar Jadhav — SDE-I at Nonstop IO Technologies" />
    <meta
      property="og:description"
      content="Backend developer in Pune working in C#, NestJS and SQL. B.Tech CSE (Data Science), KIT's College of Engineering, Kolhapur, 2026."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/opengraph-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Omkar Jadhav — SDE-I at Nonstop IO Technologies" />
    <meta
      name="twitter:description"
      content="Backend developer in Pune working in C#, NestJS and SQL. B.Tech CSE (Data Science), KIT's College of Engineering, Kolhapur, 2026."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/opengraph-image.png" />
    <!-- Webfont backs --font-mono only; --font-sans uses GitHub's native system stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="relative">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
